name: Probar monitor

on:
  workflow_dispatch:
    inputs:
      telegram:
        description: "Enviar mensaje de prueba a Telegram (requiere secrets)"
        type: boolean
        default: false
      enviar_fecha:
        description: "Revisión REAL con envío a Telegram de lo publicado en esta fecha (dd/mm/aaaa)"
        type: string
        default: ""
      enviar_hasta:
        description: "Opcional: fecha final del rango (dd/mm/aaaa); si se omite, solo enviar_fecha"
        type: string
        default: ""
      conocidos:
        description: "Con enviar_fecha: números de procedimiento ya avisados (coma) para no repetirlos"
        type: string
        default: ""
      manual:
        description: "Con enviar_fecha: simula /revisar_partidas (responde aunque no haya nada nuevo)"
        type: boolean
        default: false
      en_seco:
        description: "Con enviar_fecha: buscar y mostrar sin enviar ni guardar nada"
        type: boolean
        default: false
      explorar:
        description: "Explorar el menú Procesos y la sección Proyectos de Convocatoria (solo lectura)"
        type: boolean
        default: false
      diag_url:
        description: "URL de detalle de un procedimiento para diagnosticar la lectura de partidas"
        type: string
        default: ""
  push:
    branches: [main]

jobs:
  probar:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (github.event.inputs.telegram == 'true' || github.event.inputs.diag_url != '' || github.event.inputs.enviar_fecha != '' || github.event.inputs.explorar == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: 1. Pruebas unitarias
        run: python -m unittest discover -s tests -t . -v

      - name: 2. Demo completo (Excel + mensajes, sin portal ni Telegram)
        run: python -m monitor.main --demo

      - name: 3. ¿Se ve ComprasMX desde GitHub?
        continue-on-error: true
        run: |
          curl -sS -m 30 -o /dev/null -w "ComprasMX http=%{http_code} tiempo=%{time_total}s\n" "https://comprasmx.buengobierno.gob.mx/sitiopublico/" || echo "NO ALCANZABLE desde GitHub"

      - name: 4. Descubrir campos del portal
        continue-on-error: true
        run: |
          python -m monitor.main --descubrir
          echo "(descubrimiento guardado en artefactos)"

      - name: 5. Búsqueda real en seco (ayer y hoy, sin enviar ni guardar)
        continue-on-error: true
        run: |
          AYER=$(date -d "yesterday" +%d/%m/%Y); HOY=$(date +%d/%m/%Y)
          python -m monitor.main --dry-run --desde "$AYER" --hasta "$HOY" | tee data/dry_run.txt

      - name: 5b. Revisión real x2 (Excel + sin duplicados; Telegram DESACTIVADO en este paso)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          AYER=$(date -d "yesterday" +%d/%m/%Y); HOY=$(date +%d/%m/%Y)
          echo "--- Primera revisión"; python -m monitor.main --desde "$AYER" --hasta "$HOY" 2>&1 | grep -E "encontrados|Excel|ERROR" 
          echo "--- Segunda revisión (no debe detectar nuevos)"; python -m monitor.main --desde "$AYER" --hasta "$HOY" 2>&1 | grep -E "encontrados|Excel|ERROR"
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("data/Registro_oportunidades.xlsx")
          for ws in wb:
              print(f"Hoja {ws.title}: {ws.max_row - 1} fila(s)")
          ws = wb["Procedimientos"]
          for fila in ws.iter_rows(min_row=1, max_row=4, values_only=True):
              print([str(v)[:22] if v is not None else "" for v in fila[:13]])
          PY


      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            data/descubrir/
            data/dry_run.txt
            data_demo/Registro_oportunidades.xlsx
            data/Registro_oportunidades.xlsx
            data/logs/
          if-no-files-found: ignore

  telegram:
    if: ${{ github.event.inputs.telegram == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mensaje y Excel de prueba a Telegram
        run: |
          python -m monitor.main --demo > /dev/null
          python -m monitor.main --probar-telegram --adjunto data_demo/Registro_oportunidades.xlsx

  diag:
    if: ${{ github.event.inputs.diag_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Lectura real de partidas (3 veces, debe dar 19 en el procedimiento de prueba)
        run: python tools/diag_leer.py "${{ github.event.inputs.diag_url }}" 19

  enviar:
    if: ${{ github.event.inputs.enviar_fecha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Revisión real con envío a Telegram
        run: python -m monitor.main --desde "${{ github.event.inputs.enviar_fecha }}" --hasta "${{ github.event.inputs.enviar_hasta || github.event.inputs.enviar_fecha }}" ${{ github.event.inputs.en_seco == 'true' && '--dry-run' || '' }} ${{ github.event.inputs.manual == 'true' && '--manual' || '' }} --conocidos "${{ github.event.inputs.conocidos }}" 2>&1

  explorar:
    if: ${{ github.event.inputs.explorar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Explorar Proyectos de Convocatoria
        run: python tools/explorar_proyectos.py
